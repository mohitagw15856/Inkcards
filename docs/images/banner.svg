<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="InkCards banner">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123A40"/>
      <stop offset="1" stop-color="#1E7F8C"/>
    </linearGradient>
    <linearGradient id="badge" x1="90" y1="70" x2="290" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DB3A6"/>
      <stop offset="1" stop-color="#1E7F8C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bbg)"/>

  <!-- dotted e-ink texture -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="980" cy="60" r="4"/><circle cx="1020" cy="90" r="4"/><circle cx="1060" cy="60" r="4"/>
    <circle cx="1100" cy="90" r="4"/><circle cx="1140" cy="60" r="4"/><circle cx="1000" cy="130" r="4"/>
    <circle cx="1080" cy="130" r="4"/><circle cx="1160" cy="130" r="4"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(70 40)">
    <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#badge)"/>
    <g transform="rotate(-8 100 105)">
      <rect x="42" y="52" width="104" height="112" rx="14" fill="#EDE8DB" stroke="#0F2B30" stroke-width="4"/>
    </g>
    <g transform="rotate(4 100 105)">
      <rect x="50" y="46" width="104" height="116" rx="14" fill="#FFFFFF" stroke="#0F2B30" stroke-width="5"/>
      <text x="58" y="136" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="80" font-weight="800" fill="#0F2B30">A</text>
      <circle cx="120" cy="74" r="5.5" fill="#0F2B30"/>
      <circle cx="142" cy="74" r="5.5" fill="#0F2B30"/>
      <path d="M118 88 Q131 101 145 88" stroke="#0F2B30" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    </g>
    <g stroke="#FFC24B" stroke-width="8" fill="none" stroke-linecap="round">
      <path d="M150 150 a26 26 0 1 1 -11 -24"/>
    </g>
    <path d="M139 118 l4 15 l15 -4 z" fill="#FFC24B"/>
  </g>

  <!-- wordmark -->
  <text x="320" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#FFFFFF">InkCards</text>
  <text x="324" y="205" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="500" fill="#BFE9E3">Spaced-repetition flashcards for your pocket e-reader</text>

  <!-- little pills -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600">
    <rect x="324" y="238" width="150" height="46" rx="23" fill="#ffffff" opacity="0.12"/>
    <text x="345" y="268" fill="#EAFBF8">SM-2</text>
    <rect x="490" y="238" width="150" height="46" rx="23" fill="#ffffff" opacity="0.12"/>
    <text x="511" y="268" fill="#EAFBF8">ESP32-C3</text>
    <rect x="656" y="238" width="180" height="46" rx="23" fill="#ffffff" opacity="0.12"/>
    <text x="677" y="268" fill="#EAFBF8">CJK ready</text>
  </g>
</svg>
