; InkCards firmware for the Xteink X4/X3 (ESP32-C3).
;
; Environments
;   selftest   - CI-built, self-contained ESP32-C3 image. Links the portable
;                InkCards engine (lib/inkcards_core) and, using only the Arduino
;                core + SD library, runs a headless deck self-test over serial.
;   xteink_x4  - the full e-ink UI (src/) against the inkkit device layer.
;   xteink_x3  - identical firmware; inkkit's HAL detects X4 vs X3 at runtime.
;                The two envs exist so each target ships a named .bin artifact.
;
; The device layer comes exclusively from inkkit (pinned tag below): no
; freeink-sdk submodules or symlinks. The rendering stack (GfxRenderer, EpdFont
; and friends) is vendored under lib/ from CrossPoint Reader (MIT); see
; lib/THIRD_PARTY.md.
;
; Host unit tests for the engine are built separately with firmware/test/Makefile
; (no board or toolchain needed); CI runs those too.
;
; Note: run pio environments one at a time (pio run -e <env>); concurrent pio
; invocations race on the shared ~/.platformio package directory.

[platformio]
default_envs = selftest

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
  -std=gnu++2a
  -DCORE_DEBUG_LEVEL=3
build_unflags =
  -std=gnu++11

; --- CI target: self-contained engine self-test firmware ---------------------
[env:selftest]
extends = common
build_src_filter = +<../selftest/>
; The SD and SPI libraries ship with the Arduino-ESP32 core; no external deps.

; --- Full e-ink application --------------------------------------------------
[device_base]
extends = common
build_src_filter = +<*> -<../selftest/>
build_flags =
  ${common.build_flags}
  -DINKCARDS_DEVICE=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
lib_deps =
  ; Canonical inkkit pin: the complete device layer (HAL + vendored SDK).
  https://github.com/mohitagw15856/inkkit.git#v0.1.0-rc1

[env:xteink_x4]
extends = device_base

[env:xteink_x3]
extends = device_base
