; InkCards firmware for the Xteink X4/X3 (ESP32-C3).
;
; Environments
;   selftest  - CI-built, self-contained ESP32-C3 image. Links the portable
;               InkCards engine (lib/inkcards_core) and, using only the Arduino
;               core + SD library, runs a headless deck self-test over serial.
;               No FreeInk SDK required, so it builds anywhere PlatformIO can
;               fetch the espressif32 platform. This is what the CI build job
;               compiles.
;   device    - the full e-ink UI (src/), built against the FreeInk SDK. Use on
;               a development machine with the freeink-sdk submodule checked out.
;               See ARCHITECTURE.md and docs/HARDWARE_TESTING.md.
;
; Host unit tests for the engine are built separately with firmware/test/Makefile
; (no board or toolchain needed); CI runs those too.

[platformio]
default_envs = selftest

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
build_unflags =
  -std=gnu++11

; --- CI target: self-contained engine self-test firmware ---------------------
[env:selftest]
extends = common
build_src_filter = +<../selftest/>
; The SD and SPI libraries ship with the Arduino-ESP32 core; no external deps.

; --- Full e-ink application (requires the FreeInk SDK) ------------------------
; The device UI depends on the FreeInk SDK hardware libraries (display, GPIO,
; storage, clock) and the GfxRenderer rendering library, exactly as CrossPoint
; does. Check out the freeink-sdk submodule and provide GfxRenderer, then build
; with `pio run -e device`. Both dependencies are MIT licensed and compatible
; with this project's licence. Kept out of the default CI build because it needs
; the SDK toolchain and on-device verification.
[env:device]
extends = common
build_src_filter = +<*> -<../selftest/>
build_flags =
  ${common.build_flags}
  -DINKCARDS_DEVICE=1
lib_deps =
  ; FreeInk SDK hardware abstraction (submodule: firmware/freeink-sdk).
  ; symlink://freeink-sdk/libs/hardware/BoardConfig
  ; symlink://freeink-sdk/libs/hardware/InputManager
  ; symlink://freeink-sdk/libs/hardware/SDCardManager
  ; symlink://freeink-sdk/libs/display/FreeInkDisplay
  ; GfxRenderer (vendored from CrossPoint, MIT):
  ; symlink://vendor/GfxRenderer
